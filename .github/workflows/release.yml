# ABOUTME: On a v* tag push, packages the extension and cuts a GitHub release.
# ABOUTME: Attaches dist/mindgrapes-extension-<version>.zip as the release asset.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A tag that disagrees with manifest.json ships a zip named for the wrong
      # version, which is invisible until someone uploads it to the Web Store.
      - name: Check tag matches manifest version
        run: |
          manifest=$(node -p "require('./manifest.json').version")
          tag="${GITHUB_REF_NAME#v}"
          [[ "$manifest" == "$tag" ]] || {
            echo "tag $GITHUB_REF_NAME does not match manifest version $manifest" >&2
            exit 1
          }

      - name: Package
        run: echo "zip=$(npm run --silent package)" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$zip" --generate-notes
